name: Build and verify userscript
on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, migration tests, and public-file checks
        run: |
          node scripts/check-version.mjs
          npm run check
      - name: Install browser test packages
        timeout-minutes: 3
        run: npm install --no-save --package-lock=false --no-audit --no-fund --fetch-retries=1 --fetch-timeout=60000 playwright@1.62.1 react@18.3.1 react-dom@18.3.1
      - name: Install test browsers
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium firefox
      - name: Verify settings, migration, and feature interactions in Chromium and Firefox
        run: |
          node tests/browser-smoke.mjs
          node tests/feature-ui.mjs
          TEST_BROWSER=firefox node tests/browser-smoke.mjs
          TEST_BROWSER=firefox node tests/feature-ui.mjs
      - name: Publish generated install files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/
          if ! git diff --cached --quiet; then
            git commit -m 'Build installable userscript [skip ci]'
            git push
          fi
